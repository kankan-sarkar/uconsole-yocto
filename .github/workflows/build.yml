name: Yocto full build (self-hosted)

# Runs a real `kas build` on a self-hosted runner -- your own Yocto build
# machine, not a GitHub-hosted one (a full build needs 250GB+ disk and
# hours; see README.md). Requires a runner registered against this repo
# with the "yocto-build" label (Settings -> Actions -> Runners -> New
# self-hosted runner).
#
# Deliberately push-only, no pull_request trigger: this runner executes
# whatever's in the checked-out ref on your home machine, and this repo is
# public, so a PR-triggered build here would let anyone run code on your
# hardware. Keep it scoped to pushes to main that you (or an approved
# merge) put there.
#
# concurrency + cancel-in-progress:false is the queueing behavior: if a
# build is already running when a new push lands, the new run waits for
# the current one to finish instead of cancelling it or running alongside
# it.
#
# Sharing a download/sstate cache with an existing manual build on the
# same machine (so CI doesn't start cold, or duplicate 250GB+ of
# downloads and sstate on every run) is done through the environment,
# not through anything committed here: bitbake lists DL_DIR and
# SSTATE_DIR in BB_ENV_PASSTHROUGH_ADDITIONS, so exporting them for the
# runner is enough. The runner reads an optional `.env` file in its own
# install directory, which is the natural place for it:
#
#     # ~/actions-runner/.env
#     DL_DIR=/path/to/shared/downloads
#     SSTATE_DIR=/path/to/shared/sstate-cache
#
# Deliberately kept out of the repo so no machine's paths or usernames
# are baked into a public tree. Without it, the build still works --
# it just uses this checkout's own build/ directory for both.

on:
  push:
    branches: [main]
    paths:
      - "kas-project.yml"
      - "meta-uconsole-sdr/**"
      # So a fix to the build plumbing itself gets exercised.
      - ".github/workflows/build.yml"
      - "scripts/ci-build.sh"
  workflow_dispatch:

concurrency:
  group: yocto-full-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, yocto-build]
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4

      - name: kas build
        # Runs inside a persistent, named tmux session on the runner
        # instead of as this step's own captured subprocess -- attach
        # any time with `tmux attach -t gh-actions-yocto-build` (or via
        # the ttyd web terminal, if set up) to watch it live with a real
        # tty, which also sidesteps the stdout-buffering-under-a-pipe
        # issue a plain `run:` step would hit. This step just launches
        # the build into that session and polls a marker file for the
        # real exit code, so Actions still reports pass/fail correctly.
        run: |
          SESSION=gh-actions-yocto-build
          MARKER="/tmp/yocto-build-exit-${GITHUB_RUN_ID}"
          rm -f "$MARKER"

          # The tmux session has no parent/child relationship to this
          # step's own process, so cancelling the Actions run would
          # normally just kill this polling loop and leave the real
          # build running orphaned in tmux. Catch that and send Ctrl-C
          # into the pane instead, so bitbake gets its normal graceful
          # shutdown (finish in-flight tasks, then stop) rather than
          # being silently abandoned.
          # Is the pane back at a shell prompt? `pane_current_command`
          # reports the foreground process, so anything that isn't a
          # shell means a build (or its shutdown) is still in there.
          #
          # Two consecutive idle reads, not one: a build script between
          # sub-commands shows its own shell for an instant, and reading
          # that single sample as "finished" is precisely the wrong call
          # to get wrong here.
          wait_for_idle() {
            local limit="$1" waited=0 cmd idle=0
            while [ "$waited" -lt "$limit" ]; do
              cmd=$(tmux list-panes -t "$SESSION" -F '#{pane_current_command}' 2>/dev/null | head -1)
              case "$cmd" in
                ""|bash|sh|zsh) idle=$((idle + 1)) ;;
                *)              idle=0 ;;
              esac
              [ "$idle" -ge 2 ] && return 0
              sleep 5 &
              wait $!
              waited=$((waited + 5))
            done
            return 1
          }

          cleanup() {
            echo "Cancellation requested -- sending Ctrl-C into '$SESSION'"
            tmux send-keys -t "$SESSION" C-c
            # Don't exit while bitbake is still winding down. The next
            # queued run reuses this same session, and typing a command
            # into a pane that's still busy is how a stale job once got
            # its keystrokes interpreted by a live build.
            echo "Waiting for the pane to go idle before releasing the session..."
            wait_for_idle 300 || echo "Pane still busy after 5m -- releasing anyway."
            rm -f "$MARKER"
            exit 1
          }
          trap cleanup TERM INT

          tmux has-session -t "$SESSION" 2>/dev/null || tmux new-session -d -s "$SESSION" -x 220 -y 50

          # Same guard on the way in: never send-keys into a pane that
          # is still running something.
          if ! wait_for_idle 300; then
            echo "Session '$SESSION' is still busy after 5m -- refusing to type into it." >&2
            echo "Attach with 'tmux attach -t $SESSION' and see what's running." >&2
            exit 1
          fi

          # The build itself lives in scripts/ci-build.sh rather than in
          # this string: everything here has to survive two rounds of
          # shell quoting on its way through `tmux send-keys`, and that
          # is not a place to put logic. The script also retries the
          # fetch phase, which the upstream Yocto git servers make
          # necessary more often than you'd like.
          #
          # `cd` explicitly rather than assuming the pane starts in
          # $GITHUB_WORKSPACE: if the session already existed (manual
          # testing, or ttyd creating it first), it keeps whatever cwd
          # it started with -- which is how kas once ended up trying to
          # mkdir /build.
          #
          # Everything the build needs from the runner's environment has
          # to be handed over explicitly: a fresh tmux shell doesn't
          # inherit the runner service's environment, so a DL_DIR set in
          # ~/actions-runner/.env reaches this step but *not* bitbake.
          # Miss that and the build silently ignores a warm shared cache
          # and refetches ~16GB into its own workspace -- it still
          # succeeds, just hours later, which is the worst way for a
          # misconfiguration to present itself.
          #
          # Only non-empty values are passed. Exporting DL_DIR='' would
          # be worse than not exporting it: bitbake would take the empty
          # string as the setting rather than falling back to its
          # default.
          ENV_PREFIX=""
          for var in DL_DIR SSTATE_DIR KAS_VENV; do
            eval "val=\${$var:-}"
            if [ -n "$val" ]; then
              ENV_PREFIX="$ENV_PREFIX $var='$val'"
            fi
          done
          echo "Passing to the build:${ENV_PREFIX:- (nothing -- using in-tree defaults)}"

          tmux send-keys -t "$SESSION" "cd $GITHUB_WORKSPACE &&${ENV_PREFIX} ./scripts/ci-build.sh kas-project.yml; echo \$? > $MARKER" Enter

          echo "Build launched in tmux session '$SESSION' -- attach with: tmux attach -t $SESSION"
          while [ ! -f "$MARKER" ]; do
            sleep 15 &
            wait $!
          done
          CODE=$(cat "$MARKER")
          rm -f "$MARKER"
          echo "kas build finished with exit code $CODE"
          exit "$CODE"

      - name: Show build output
        if: always()
        run: |
          ls -lh build/tmp/deploy/images/uconsole-cm4/ || true

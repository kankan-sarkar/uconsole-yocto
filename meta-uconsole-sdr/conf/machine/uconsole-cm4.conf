#@TYPE: Machine
#@NAME: ClockworkPi uConsole (CM4)
#@DESCRIPTION: Machine configuration for the ClockworkPi uConsole powered by Raspberry Pi Compute Module 4

require conf/machine/raspberrypi4-64.conf

# ------------------------------------------------------------------
# Storage & Boot overrides (SD Card + NVMe / PCIe)
# ------------------------------------------------------------------
# Define WIC format for direct SD Card OR NVMe dd flashing
IMAGE_FSTYPES = "tar.bz2 ext4 wic.bz2 wic.bmap"
WKS_FILE = "sdimage-raspberrypi.wks"

# Force WIC to generate a partition table suitable for SD/NVMe
# We skip initramfs by ensuring the kernel handles both mmcblk and nvme block devices natively.
INITRAMFS_IMAGE_BUNDLE = "0"

# Uconsole CM4 Specific config.txt settings
#
# dtoverlay=clockworkpi-uconsole, ignore_lcd=1, and max_framebuffers=2
# are lifted verbatim from ClockworkPi's own reference config.txt for
# the uConsole CM4 (clockworkpi/uConsole, Code/patch/cm4/20260414/
# README.md) -- confirmed against their actual kernel fork
# (cuu/ClockworkPi-linux, rpi-6.12.y). The overlay wires up the AIO v2
# board's real PMIC (AXP221 on i2c0 @0x34, not a generic AXP20X on
# i2c_arm as previously assumed here), the DSI panel, and its
# backlight -- see linux-raspberrypi_%.bbappend for how the overlay
# and its two driver modules (panel-cwu50, ocp8178-backlight) get
# built, since neither exists in the stock RPi Foundation kernel tree.
# ignore_lcd=1 tells the firmware not to probe its own default LCD
# path, since a fully custom panel driver handles it instead.
#
# dtoverlay=dwc2,dr_mode=host forces the CM4's USB-OTG controller into
# host mode -- also from the same reference config -- which is how the
# uConsole's onboard keyboard (an MCU that presents as a standard USB
# HID device, see clockworkpi/uConsole Code/uconsole_keyboard/) is
# actually reachable. Without this it's simply not on the bus.
RPI_EXTRA_CONFIG = " \
# Enable PCIe for the NVMe drive and AIO v2 board hub \n\
dtparam=pciex1 \n\
# Set specific boot order: SD Card (1) then NVMe (6) -> 0xf461 \n\
BOOT_ORDER=0xf461 \n\
# AIO v2 board PMIC (AXP221), DSI panel, and backlight -- see comment above \n\
dtoverlay=clockworkpi-uconsole \n\
ignore_lcd=1 \n\
max_framebuffers=2 \n\
# Onboard keyboard MCU is a USB HID device behind the OTG controller \n\
dtoverlay=dwc2,dr_mode=host \n\
# RTC (ds3231/ds1307) on the general-purpose i2c_arm bus -- separate \n\
# from the PMIC's own i2c0, not part of ClockworkPi's reference \n\
# overlay above; kept as previously configured, unconfirmed against \n\
# real AIO v2 board documentation \n\
dtparam=i2c_arm=on \n\
dtoverlay=i2c-rtc,ds3231 \n\
# Onboard audio codec for FM/HAM voice demodulation output \n\
dtparam=audio=on \n\
# Disable Bluetooth to save power \n\
dtoverlay=disable-bt \n\
"

# ------------------------------------------------------------------
# Graphics and Display (DSI)
# ------------------------------------------------------------------
# Enable the VC4 graphics driver (KMS)
MACHINE_FEATURES += "vc4graphics"
DISABLE_OVERSCAN = "1"
# Disable HDMI to save power since uConsole uses DSI
HDMI_FORCE_HOTPLUG = "0"

# ------------------------------------------------------------------
# Networking & Features
# ------------------------------------------------------------------
MACHINE_FEATURES += "wifi rtc pci"

# Include out-of-tree RTL8812AU driver for the AC1200 Wi-Fi dongle
MACHINE_EXTRA_RRECOMMENDS += " rtl8812au kernel-module-rtl8812au"

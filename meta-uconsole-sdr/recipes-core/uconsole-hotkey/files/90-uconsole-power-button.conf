[Login]
# The physical power button is fully owned by uconsole-hotkey.py
# (short press -> shutdown menu, long press -> forced poweroff) via
# the axp20x-pek KEY_POWER input device. Without this, systemd-logind
# would also react to the same evdev events with its own default
# HandlePowerKey=poweroff behavior, racing our daemon on every press.
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore

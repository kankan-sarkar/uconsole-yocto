# uConsole minimal kiosk config. Every GUI app on this device
# (uconsole-oobe, uconsole-panel, uconsole-power-menu, uconsole-lock)
# is launched fullscreen on demand via a systemd unit or a hardware
# hotkey -- never through a Weston-provided panel or launcher.
#
# Real hardware finding: weston-init's own upstream default weston.ini
# has everything commented out except backend/require-input below, so
# Weston falls back to its compiled-in default shell, desktop-shell.so.
# Its reference UI always draws a top panel (a terminal-icon launcher
# on the left, a clock on the right) the instant no fullscreen client
# covers the screen -- that's not a crash or a leftover from any bug,
# it's just what desktop-shell always shows when idle, and nothing
# here ever told Weston to use anything else. kiosk-shell.so is
# Weston's own purpose-built alternative for exactly this case --
# forces every client fullscreen, draws no panel, no launcher, no
# clock -- matching requirement.md 5.3's "minimalist" compositor goal
# and this project's on-demand-only app model.
[core]
backend=drm-backend.so
require-input=false
shell=kiosk-shell.so

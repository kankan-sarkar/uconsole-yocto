# Weston has to be on the *active* VT when it takes DRM master, or it
# ends up compositing to a surface nothing scans out: the display keeps
# showing whatever the text console last drew, and every client that
# maps afterwards is invisible. Reproduced repeatedly under QEMU, where
# the kernel console owns tty1 and nothing ever switches away from it --
# weston.service reports "active", logind reports the session active,
# the Wayland socket accepts clients, and the screen still shows the
# login prompt. Restarting Weston with tty7 already active fixes it
# every time, which is what pins the cause down.
#
# The "+" prefix runs this as root regardless of the unit's User=weston:
# changing VTs needs CAP_SYS_TTY_CONFIG, which the weston user lacks.
[Service]
ExecStartPre=+/usr/bin/chvt 7

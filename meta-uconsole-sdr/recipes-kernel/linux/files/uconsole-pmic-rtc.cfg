# AIO v2 / uConsole PMIC -- confirmed as an AXP221 on i2c0 @0x34
# (clockworkpi-uconsole-overlay.dts, see uconsole-cm4.conf), not a
# generic "AXP228 family" chip on i2c_arm as this comment previously
# assumed. AXP221 is still handled by the same axp20x MFD framework
# (confirmed against the real drivers/mfd/axp20x-i2c.c of_device_id
# table: "x-powers,axp221" is a listed compatible string), so these
# CONFIG symbols were already the right ones -- the overlay providing
# the actual devicetree node was the missing piece. Battery level and
# charging status exposed to userspace via power_supply class; the PEK
# (power button) input driver also lives under CONFIG_INPUT_AXP20X_PEK
# below, see uconsole-hotkey.py for how it's consumed.
CONFIG_MFD_AXP20X=y
CONFIG_MFD_AXP20X_I2C=y
CONFIG_AXP20X_POWER=y
CONFIG_INPUT_AXP20X_PEK=y
CONFIG_REGULATOR_AXP20X=y

# Battery-backed RTC on the AIO v2 board (ds1307/ds3231 family over
# I2C, enabled via the i2c-rtc dtoverlay in RPI_EXTRA_CONFIG).
# RTC_HCTOSYS syncs system time from it automatically at boot without
# needing a separate systemd hwclock-sync unit.
CONFIG_RTC_CLASS=y
CONFIG_RTC_DRV_DS1307=y
CONFIG_RTC_HCTOSYS=y
CONFIG_RTC_HCTOSYS_DEVICE="rtc0"

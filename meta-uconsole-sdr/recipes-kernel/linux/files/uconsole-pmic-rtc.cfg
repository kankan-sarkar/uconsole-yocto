# AIO v2 / uConsole PMIC (AXP228 family, I2C) -- battery level and
# charging status exposed to userspace via power_supply class.
CONFIG_MFD_AXP20X=y
CONFIG_MFD_AXP20X_I2C=y
CONFIG_AXP20X_POWER=y
CONFIG_INPUT_AXP20X_PEK=y
CONFIG_REGULATOR_AXP20X=y

# Battery-backed RTC on the AIO v2 board (ds1307/ds3231 family over
# I2C, enabled via the i2c-rtc dtoverlay in RPI_EXTRA_CONFIG).
# RTC_HCTOSYS syncs system time from it automatically at boot without
# needing a separate systemd hwclock-sync unit.
CONFIG_RTC_CLASS=y
CONFIG_RTC_DRV_DS1307=y
CONFIG_RTC_HCTOSYS=y
CONFIG_RTC_HCTOSYS_DEVICE="rtc0"

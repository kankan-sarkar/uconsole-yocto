# Build NVMe directly into the kernel to skip initramfs
CONFIG_BLK_DEV_NVME=y
CONFIG_NVME_CORE=y
# CONFIG_NVME_MULTIPATH is not set

# CPU Frequency Scaling (Ondemand Governor)
CONFIG_CPU_FREQ=y
CONFIG_CPU_FREQ_GOV_ONDEMAND=y
CONFIG_CPU_FREQ_DEFAULT_GOV_ONDEMAND=y

# Audio subsystem (required for FM/HAM voice demodulation output to
# the built-in speakers/headphone jack, see requirement.md 4.4). Kept
# as loadable modules since they aren't needed until userspace brings
# up pipewire, so they don't cost anything at boot/mount time.
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_BCM2835=m
CONFIG_SND_USB_AUDIO=m

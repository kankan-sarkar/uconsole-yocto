# AIO v2 board's custom DSI panel (cw,cwu50) and its backlight driver
# (ocp8178-backlight) -- ported from ClockworkPi's own kernel fork,
# see panel-cwu50.c and ocp8178_bl.c in this same directory, and
# clockworkpi-uconsole-overlay.dts for the devicetree wiring.
#
# Confirmed via a real build: the stock defconfig has
# CONFIG_BACKLIGHT_CLASS_DEVICE=m (module), and Kconfig silently
# drops a `depends on` symbol back to "not set" -- no error, no
# warning -- rather than granting =y when a dependency is only =m.
# Both DRM_PANEL_CWU50 and BACKLIGHT_OCP8178 depend on it, so it must
# be promoted to built-in too, not just requested here. Safe: a
# module (=m) can depend on a built-in (=y) fine, so this doesn't
# break whatever else already used it as a module.
CONFIG_BACKLIGHT_CLASS_DEVICE=y
CONFIG_DRM_MIPI_DSI=y
CONFIG_DRM_PANEL_CWU50=y
CONFIG_BACKLIGHT_OCP8178=y

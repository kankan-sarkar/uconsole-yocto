<!DOCTYPE html><html lang="en" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#081425;color:#d8e3fb;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-container-highest": "#2a3548", "tertiary-container": "#001c10", "on-secondary-container": "#00374d", "background": "#081425", "surface-dim": "#081425", "primary-fixed-dim": "#bec6e0", "on-tertiary-fixed-variant": "#005137", "surface-variant": "#2a3548", "on-primary-container": "#798098", "on-surface-variant": "#c6c6cd", "secondary-fixed": "#c4e7ff", "error-container": "#93000a", "tertiary-fixed-dim": "#45dfa4", "secondary-fixed-dim": "#7bd0ff", "primary-container": "#0f172a", "outline": "#909097", "on-secondary-fixed-variant": "#004c69", "surface-tint": "#bec6e0", "on-primary-fixed-variant": "#3f465c", "secondary": "#7bd0ff", "primary-fixed": "#dae2fd", "surface-container-low": "#111c2d", "inverse-on-surface": "#263143", "on-secondary-fixed": "#001e2c", "surface-container-high": "#1f2a3c", "inverse-primary": "#565e74", "on-tertiary": "#003825", "surface-bright": "#2f3a4c", "on-secondary": "#00354a", "surface": "#081425", "on-primary-fixed": "#131b2e", "surface-container": "#152031", "surface-container-lowest": "#040e1f", "on-background": "#d8e3fb", "error": "#ffb4ab", "on-primary": "#283044", "primary": "#bec6e0", "on-tertiary-fixed": "#002114", "on-error-container": "#ffdad6", "outline-variant": "#45464d", "inverse-surface": "#d8e3fb", "on-tertiary-container": "#009367", "tertiary-fixed": "#68fcbf", "secondary-container": "#00a6e0", "on-error": "#690005", "tertiary": "#45dfa4", "on-surface": "#d8e3fb" }, borderRadius: { DEFAULT: "0.125rem", lg: "0.25rem", xl: "0.5rem", full: "0.75rem" }, spacing: { "space-md": "0.5rem", gutter: "0.75rem", "space-sm": "0.25rem", "space-lg": "1rem", "space-xs": "0.125rem", margin: "1rem", "space-xl": "1.5rem" }, fontFamily: { "label-lg": ["JetBrains Mono"], "label-md": ["JetBrains Mono"], "body-sm": ["JetBrains Mono"], "headline-sm": ["JetBrains Mono"], "label-sm": ["JetBrains Mono"], "headline-lg": ["JetBrains Mono"], "headline-lg-mobile": ["JetBrains Mono"], "headline-md": ["JetBrains Mono"], "body-md": ["JetBrains Mono"], "body-lg": ["JetBrains Mono"] } } } }</script><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head><body class="bg-surface text-on-surface font-body flex flex-col min-h-screen dark pt-safe pb-safe"><main class="flex flex-col relative w-full bg-surface flex-grow"><div class="flex flex-col w-full text-on-surface font-body-md p-gutter gap-space-lg select-none relative overflow-hidden max-w-7xl mx-auto h-screen justify-between" id="uConsoleApp" style="--theme-hue: 195;">
<!-- Ambient background glow -->
<div class="absolute inset-0 -z-10 overflow-hidden pointer-events-none">
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 rounded-full blur-[90px] opacity-25 transition-all duration-700" id="ambientGlow" style="background-color: hsl(var(--theme-hue), 90%, 55%);"></div>
</div>
<!-- 1. Top hardware status bar -->
<header aria-label="Hardware Status" class="flex items-center justify-between px-space-md py-space-sm bg-surface-container/70 backdrop-blur-md rounded-lg shadow-sm">
<div class="flex items-center gap-space-md">
<!-- WiFi Status -->
<div class="flex items-center gap-space-xs" title="WiFi Connected">
<span class="material-symbols-outlined text-secondary text-base">wifi</span>
<span class="text-label-sm text-on-surface-variant font-label-sm">wlan0</span>
</div>
<!-- CPU Temp -->
<div class="flex items-center gap-space-xs" title="CPU Temperature">
<span class="material-symbols-outlined text-tertiary text-base">device_thermostat</span>
<span class="text-label-sm text-on-surface-variant font-label-sm" id="cpuTempText">42°C</span>
</div>
</div>
<div class="flex items-center gap-space-md">
<!-- Battery -->
<div class="flex items-center gap-space-xs" title="Battery 88%">
<span class="material-symbols-outlined text-tertiary text-base" style="font-variation-settings: 'FILL' 1;">battery_80</span>
<span class="text-label-sm text-on-surface-variant font-label-sm">88%</span>
</div>
<!-- Clock -->
<div class="text-label-sm text-on-surface font-label-sm" id="statusBarClock">18:51</div>
</div>
</header>
<!-- Main Login Container (uConsole form factor optimized) -->
<div class="flex flex-col items-center justify-center w-full max-w-md mx-auto my-auto"><div class="flex flex-col p-space-lg rounded-xl bg-surface-container/75 backdrop-blur-xl shadow-xl relative overflow-hidden transition-all duration-300 w-full" id="loginCard" style="border: 1px solid hsla(var(--theme-hue), 80%, 70%, 0.15);"><div class="flex flex-col items-center pb-space-lg mb-space-md border-b border-outline-variant/20 text-center"><div class="relative w-20 h-20 rounded-full bg-surface-container-highest flex items-center justify-center overflow-hidden shadow-inner mb-space-md" style="border: 2px solid hsla(var(--theme-hue), 70%, 60%, 0.4);"><img alt="Avatar" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBvyo1F8xAlLqwAflPoIjCV3eaPLqyAsWcNC07EdB3XOh8b7DvhNpR5LYdBQ_5m31tfXo0OM2dhT3NTl1PKoUdS6Px5Ygtad52vNRxSrQOsTRX7uirDNBgo4lgQjRT0k_jrBEQ8Ez6sSz2a-1CqUF3Lsx-Uy6Cbxap1ayBwlgFx7D49H4DX6igwZNSu5eWVr0a2_bwEX1eh82-HqQaxbqlhhzsKxgivD9xqvU9ZYrOTXcOIyyWIlzzv"><div class="absolute bottom-0 right-0 w-3 h-3 bg-tertiary rounded-tl-sm" title="Active Session"></div></div><span class="text-headline-sm font-headline-sm text-on-surface truncate">User1</span></div><form class="flex flex-col gap-space-md" id="authForm" onsubmit="event.preventDefault(); handleAuth();"><div class="flex flex-col gap-space-xs"><div class="flex justify-between items-center"><label class="text-label-sm text-on-surface-variant font-label-sm uppercase tracking-wider" for="passwordInput">Password</label><span class="text-label-sm text-secondary cursor-pointer hover:underline" onclick="fillHint()"><br></span></div><div class="relative flex items-center" id="passwordWrapper"><span class="absolute left-space-md material-symbols-outlined text-outline text-base">key</span><input autocomplete="current-password" class="w-full bg-surface-container-lowest text-on-surface text-body-md font-body-md py-2.5 pl-9 pr-10 rounded outline-none transition-all placeholder:text-outline-variant focus:ring-1 focus:ring-secondary" id="passwordInput" placeholder="Enter password..." style="border: 1px solid hsla(var(--theme-hue), 50%, 60%, 0.2);" type="password"><button aria-label="Toggle Password Visibility" class="absolute right-2 p-1 text-on-surface-variant hover:text-on-surface transition-colors" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button"><span class="material-symbols-outlined text-base" id="eyeIcon">visibility</span></button></div></div><div class="hidden items-center gap-space-sm p-space-sm rounded text-body-sm font-body-sm transition-all" id="feedbackMsg"><span class="material-symbols-outlined text-base" id="feedbackIcon">error</span><span class="truncate" id="feedbackText">Authentication failed: Invalid credentials</span></div><button class="mt-space-sm w-full py-3 px-space-md rounded font-label-lg text-label-lg tracking-wider uppercase flex items-center justify-center gap-space-sm transition-all shadow-md group cursor-pointer" id="submitBtn" style="background-color: hsl(var(--theme-hue), 80%, 75%); color: #081425;" type="submit"><span class="material-symbols-outlined text-base transition-transform group-hover:translate-x-1">login</span><span class="">Login</span></button></form><div class="absolute inset-0 bg-surface-container/95 backdrop-blur-md flex flex-col items-center justify-center p-space-xl text-center hidden z-20 transition-all" id="successOverlay"><div class="w-16 h-16 rounded-full flex items-center justify-center mb-space-md shadow-lg" style="background-color: hsl(var(--theme-hue), 80%, 25%); border: 2px solid hsl(var(--theme-hue), 80%, 70%);"><span class="material-symbols-outlined text-3xl" style="color: hsl(var(--theme-hue), 90%, 80%);">verified_user</span></div><h2 class="text-headline-sm font-headline-sm text-on-surface mb-space-xs">ACCESS GRANTED</h2><p class="text-body-sm text-on-surface-variant mb-space-lg">Initializing interactive shell session...</p><div class="w-full bg-surface-container-highest h-1.5 rounded-full overflow-hidden"><div class="h-full bg-tertiary rounded-full transition-all duration-1000" id="progressBar" style="width: 0%;"></div></div></div></div></div>
<!-- Footer Info / Hardware shortcuts -->
<footer class="mt-auto flex items-center justify-between text-label-sm font-label-sm text-outline px-space-xs">



</footer>
<!-- Inline Script for UI Delight & Interactivity -->
<script>
    // Clock updater
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const clockEl = document.getElementById('statusBarClock');
      if (clockEl) clockEl.textContent = `${hours}:${minutes}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Password visibility toggle
    function togglePasswordVisibility() {
      const input = document.getElementById('passwordInput');
      const eyeIcon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        eyeIcon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        eyeIcon.textContent = 'visibility';
      }
    }

    // Hint helper
    function fillHint() {
      const input = document.getElementById('passwordInput');
      input.value = 'uconsole';
      input.focus();
    }

    // Toggle Customization Panel
    function toggleCustomizationPanel() {
      const panel = document.getElementById('customizationPanel');
      const chevron = document.getElementById('tuneChevron');
      if (panel.classList.contains('hidden')) {
        panel.classList.remove('hidden');
        chevron.style.transform = 'rotate(180deg)';
      } else {
        panel.classList.add('hidden');
        chevron.style.transform = 'rotate(0deg)';
      }
    }

    // Update Theme Hue live
    function updateThemeHue(val) {
      const app = document.getElementById('uConsoleApp');
      app.style.setProperty('--theme-hue', val);
      document.getElementById('hueValueDisplay').textContent = val + '°';
      
      // Update dynamic button color matching hue
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.style.backgroundColor = `hsl(${val}, 80%, 75%)`;
    }

    // Surface styles switcher
    function setSurfaceStyle(styleKey) {
      const card = document.getElementById('loginCard');
      ['styleGlass', 'styleObsidian', 'styleMatrix'].forEach(id => {
        const btn = document.getElementById(id);
        btn.classList.remove('border-secondary/30', 'bg-surface-container-highest');
        btn.classList.add('border-transparent');
      });

      if (styleKey === 'glass') {
        card.className = "flex flex-col p-space-lg rounded-xl bg-surface-container/75 backdrop-blur-xl shadow-xl relative overflow-hidden transition-all duration-300";
        document.getElementById('styleGlass').classList.add('border-secondary/30', 'bg-surface-container-highest');
      } else if (styleKey === 'obsidian') {
        card.className = "flex flex-col p-space-lg rounded-xl bg-surface-container-lowest shadow-2xl relative overflow-hidden transition-all duration-300";
        document.getElementById('styleObsidian').classList.add('border-secondary/30', 'bg-surface-container-highest');
      } else if (styleKey === 'matrix') {
        card.className = "flex flex-col p-space-lg rounded-xl bg-tertiary-container shadow-xl relative overflow-hidden transition-all duration-300";
        document.getElementById('styleMatrix').classList.add('border-secondary/30', 'bg-surface-container-highest');
      }
    }

    // Authentication simulation (6. Error & Success handling)
    function handleAuth() {
      const passInput = document.getElementById('passwordInput');
      const wrapper = document.getElementById('passwordWrapper');
      const feedbackMsg = document.getElementById('feedbackMsg');
      const feedbackText = document.getElementById('feedbackText');
      const feedbackIcon = document.getElementById('feedbackIcon');
      const successOverlay = document.getElementById('successOverlay');
      const progressBar = document.getElementById('progressBar');

      const val = passInput.value.trim();

      if (val === 'uconsole') {
        // Success State
        feedbackMsg.classList.add('hidden');
        successOverlay.classList.remove('hidden');
        
        // Animate progress bar
        setTimeout(() => {
          progressBar.style.width = '100%';
        }, 100);

        // Reset after simulated boot
        setTimeout(() => {
          successOverlay.classList.add('hidden');
          progressBar.style.width = '0%';
          passInput.value = '';
        }, 3000);

      } else {
        // Error State with smooth shake animation
        feedbackMsg.classList.remove('hidden');
        feedbackMsg.className = "flex items-center gap-space-sm p-space-sm rounded text-body-sm font-body-sm transition-all bg-error-container text-on-error-container";
        feedbackIcon.textContent = "error";
        feedbackText.textContent = "Authentication failed: Invalid credentials";

        // Trigger shake class
        wrapper.classList.add('animate-bounce');
        setTimeout(() => {
          wrapper.classList.remove('animate-bounce');
        }, 500);

        passInput.focus();
      }
    }
  </script>
</div></main>


</body></html>

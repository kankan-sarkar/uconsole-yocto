header:
  version: 14

machine: uconsole-cm4
distro: poky
target:
  - uconsole-image

repos:
  poky:
    url: "https://git.yoctoproject.org/git/poky"
    refspec: "kirkstone"
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: "https://git.openembedded.org/meta-openembedded"
    refspec: "kirkstone"
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:
      meta-perl:
      meta-multimedia:  # pipewire/wireplumber (requirement.md 4.4)
      meta-webserver:   # nginx, netdata (requirement.md 5.5, 5.6)

  meta-raspberrypi:
    url: "https://git.yoctoproject.org/git/meta-raspberrypi"
    refspec: "kirkstone"

  meta-sdr:
    url: "https://github.com/balister/meta-sdr.git"
    refspec: "kirkstone"

  meta-security:
    url: "https://git.yoctoproject.org/git/meta-security"
    refspec: "kirkstone"

  meta-qt6:
    # python3-pyqt6 doesn't exist until this branch -- 6.5 predates the
    # recipes-python/pyqt6 directory. Verified 6.6 declares kirkstone in
    # LAYERSERIES_COMPAT.
    #
    # meta-qt5 was previously included alongside this. A single bitbake
    # build can only resolve one provider for a given recipe name, and
    # both layers declare a recipe named "qtbase" -- with both present,
    # bitbake resolved the ambiguous qtbase-native provider to
    # meta-qt5's (5.15.7) instead of meta-qt6's, breaking
    # python3-pyqt6's do_configure ("sip-build: Qt v6 is required, not
    # v5.15.7"). There's no way to give one recipe Qt5's qtbase and
    # another Qt6's qtbase in the same build, so this was a genuine
    # choice, not just an ambiguity to pin away: meta-sdr's gqrx
    # recipe is a real Qt5-only app (removed from
    # packagegroup-uconsole-sdr.bb), and gnuradio's optional Qt5 GUI
    # blocks are disabled via a bbappend (nothing here consumed the
    # gnuradio-qtgui subpackage). See the LAYERDEPENDS_sdr-layer
    # override below -- meta-sdr's own layer.conf hard-requires
    # qt5-layer regardless of whether any of its recipes we actually
    # build need it.
    url: "https://code.qt.io/yocto/meta-qt6.git"
    refspec: "6.6"

  meta-rtlwifi:
    # Out-of-tree Realtek USB Wi-Fi driver recipes, incl. rtl8812au for
    # the AC1200 dongle (monitor mode / injection). Not on any release
    # branch -- LAYERSERIES_COMPAT on master already lists kirkstone.
    url: "https://github.com/EmbeddedAndroid/meta-rtlwifi.git"
    refspec: "master"

  meta-uconsole-sdr:
    # Local path since this layer is in the same repository
    path: "meta-uconsole-sdr"

bblayers_conf_header:
  standard: |
    POKY_BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""

local_conf_header:
  standard: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_rpm"
    USER_CLASSES = "buildstats"
    PATCHRESOLVE = "noop"
  systemd: |
    DISTRO_FEATURES:append = " systemd wayland wifi opengl pam polkit security"
    VIRTUAL-RUNTIME_init_manager = "systemd"
    DISTRO_FEATURES_BACKFILL_CONSIDERED = "sysvinit"
    VIRTUAL-RUNTIME_initscripts = ""
  performance: |
    # Capped at 2, not oe.utils.cpu_count() -- the actual build machine
    # (hs01) has 7.5GB RAM, well under Yocto's 16GB recommendation and
    # even under the "reduce to 2" threshold this README already
    # documented for 8GB-class hosts, which was never actually wired
    # up here. Confirmed via dmesg: unthrottled parallelism triggered
    # a real OOM event (3 kills in under a minute, including cc1plus
    # doing real compile work and the bash shell running the build
    # itself), killing the build outright rather than just running
    # slowly.
    BB_NUMBER_THREADS = "2"
    PARALLEL_MAKE = "-j 2"
  sdr_layer_qt5_override: |
    # meta-sdr/conf/layer.conf unconditionally declares
    # LAYERDEPENDS_sdr-layer with qt5-layer in it, so bitbake refuses
    # to even start ("Layer 'sdr-layer' depends on layer 'qt5-layer',
    # but this layer is not enabled") unless meta-qt5 is present --
    # regardless of whether any meta-sdr recipe we actually build
    # needs it. It doesn't, once gqrx is removed and gnuradio's qtgui5
    # PACKAGECONFIG is disabled (see packagegroup-uconsole-sdr.bb and
    # the gnuradio_git.bbappend). Override the declared value with
    # qt5-layer dropped rather than carrying a whole extra Qt version
    # for a layer-level formality nothing uses.
    LAYERDEPENDS_sdr-layer = "core meta-python openembedded-layer networking-layer filesystems-layer"
  gqrx_bbmask: |
    # bitbake parses every .bb file across all enabled layers
    # unconditionally, to populate its recipe cache -- regardless of
    # whether anything actually depends on it. Removing gqrx from
    # packagegroup-uconsole-sdr.bb doesn't stop meta-sdr's
    # gqrx_git.bb from still being *parsed*, and it unconditionally
    # `inherit`s classes/cmake_qt5.bbclass (a class `inherit`, unlike
    # a DEPENDS entry, is resolved immediately at parse time, not
    # deferred to dependency resolution) -- which no longer exists
    # now that meta-qt5 is gone: "ParseError ... Could not inherit
    # file classes/cmake_qt5.bbclass". Mask the file out entirely so
    # bitbake never tries to parse it.
    BBMASK += "meta-sdr/recipes-applications/gqrx/"
